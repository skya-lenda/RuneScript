<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneScript - Terminal Interativo</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #06060c;
            color: #d1d1f6;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .terminal-container {
            width: 100%;
            max-width: 850px;
            background-color: #0a0a14;
            border: 2px solid #3b3bc4;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.2);
            overflow: hidden;
            cursor: text;
            margin-bottom: 40px; /* Espaço para não cobrir o botão no mobile */
        }

        /* Barra superior */
        .terminal-header {
            background-color: #121226;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222244;
            user-select: none;
        }

        .terminal-buttons {
            display: flex;
            gap: 8px;
            margin-right: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .terminal-title {
            color: #7979aa;
            font-size: 13px;
            flex-grow: 1;
            text-align: center;
            margin-right: 50px;
        }

        /* Conteúdo */
        .terminal-body {
            padding: 25px;
            line-height: 1.6;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px dashed #222244;
            padding-bottom: 25px;
            user-select: none;
        }

        .brand-logo {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(59, 59, 196, 0.6));
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
            letter-spacing: 1px;
        }

        .brand-slogan {
            font-size: 12px;
            color: #00d2ff;
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Linhas do Terminal */
        .line {
            margin-bottom: 8px;
            font-size: 15px;
            word-break: break-all;
        }

        .prompt {
            color: #00f0ff;
            font-weight: bold;
            user-select: none;
        }

        .command {
            color: #9d4edd;
            font-weight: bold;
        }

        .output {
            color: #b5b5e6;
            margin-left: 15px;
            margin-bottom: 15px;
        }

        /* Grid de Features interno */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 15px 0 15px 15px;
        }

        .feature-card {
            background-color: #0d0d1f;
            border-left: 3px solid #9d4edd;
            padding: 12px;
            border-radius: 0 4px 4px 0;
        }

        .feature-title {
            color: #00f0ff;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 14px;
            color: #a0a0cf;
        }

        /* Input Ativo */
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }

        #terminal-input {
            background: transparent;
            border: none;
            color: #9d4edd;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            flex-grow: 1;
            outline: none;
            margin-left: 8px;
            padding: 0;
        }

        .discord-link {
            color: #5865F2;
            text-decoration: underline;
            font-weight: bold;
        }

        /* Botão Fixo do Discord no Canto */
        .floating-discord-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            z-index: 1000;
        }

        .floating-discord-btn:hover {
            background-color: #4752c4;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 25px rgba(88, 101, 242, 0.6);
        }

        .discord-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <a href="https://discord.gg/8HUWVdDwkc" target="_blank" class="floating-discord-btn">
        <svg class="discord-icon" viewBox="0 0 127.14 96.36">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.71-11,68.6,68.6,0,0,1-10.64-5.12c.91-.66,1.8-1.34,2.65-2a75.58,75.58,0,0,0,72.76,0c.85.69,1.74,1.37,2.65,2a68.44,68.44,0,0,1-10.64,5.12,74.74,74.74,0,0,0,6.71,11,105.73,105.73,0,0,0,31.57-18.83C129.54,50.93,123.63,28.1,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.87,46,53.66,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.11,46,95.9,53,91,65.69,84.69,65.69Z"/>
        </svg>
        Discord Oficial
    </a>

    <div class="terminal-container" id="terminal">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-title">runescript@core: ~</div>
        </div>

        <div class="terminal-body">
            <div class="brand-section">
                <img src="1000609185.png" alt="RuneScript Logo" class="brand-logo">
                <h1 class="brand-name">RuneScript</h1>
                <div class="brand-slogan">Escreva. Execute. Automatize.</div>
            </div>

            <div id="terminal-history">
                <div class="line">
                    <span class="prompt">runescript ></span> <span class="command">info</span>
                </div>
                <div class="line output">
                    Uma linguagem poderosa e intuitiva feita para automação, bots e muito mais.
                </div>
                <div class="line">
                    <span class="prompt">runescript ></span> <span class="command">help</span>
                </div>
                <div class="line output">
                    Comandos disponíveis: <span style="color:#00f0ff">help</span>, <span style="color:#00f0ff">info</span>, <span style="color:#00f0ff">features</span>, <span style="color:#00f0ff">discord</span>, <span style="color:#00f0ff">clear</span>
                </div>
            </div>

            <div class="input-line">
                <span class="prompt">runescript ></span>
                <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('terminal-input');
        const historyEl = document.getElementById('terminal-history');
        const terminalContainer = document.getElementById('terminal');

        // Mantém o foco no input
        terminalContainer.addEventListener('click', () => {
            inputEl.focus();
        });

        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const rawInput = this.value;
                const command = rawInput.trim().toLowerCase();
                
                if (rawInput.trim() === '') return;

                // Replica comando no histórico
                const cmdLine = document.createElement('div');
                cmdLine.className = 'line';
                cmdLine.innerHTML = `<span class="prompt">runescript ></span> <span class="command">${rawInput}</span>`;
                historyEl.appendChild(cmdLine);

                let outputHTML = '';

                switch(command) {
                    case 'help':
                    case 'ajuda':
                        outputHTML = `Comandos disponíveis:<br>
                        - <strong style="color:#00f0ff">info</strong>: Sobre a linguagem.<br>
                        - <strong style="color:#00f0ff">features</strong>: Vantagens da RuneScript.<br>
                        - <strong style="color:#00f0ff">discord</strong>: Link direto para a comunidade oficial.<br>
                        - <strong style="color:#00f0ff">clear</strong>: Limpa o histórico do terminal.`;
                        break;
                        
                    case 'info':
                        outputHTML = 'Uma linguagem poderosa e intuitiva feita para automação, bots e muito mais.';
                        break;
                        
                    case 'features':
                        outputHTML = `
                        <div class="features-grid">
                            <div class="feature-card"><div class="feature-title">[⚡] SINTAXE LIMPA</div><div class="feature-desc">Fácil de aprender, rápida de escrever.</div></div>
                            <div class="feature-card"><div class="feature-title">[📦] FLEXÍVEL</div><div class="feature-desc">Crie do seu jeito. Do simples ao avançado.</div></div>
                            <div class="feature-card"><div class="feature-title">[🧩] EXTENSÍVEL</div><div class="feature-desc">Plugins, módulos e bibliotecas.</div></div>
                            <div class="feature-card"><div class="feature-title">[👥] COMUNIDADE</div><div class="feature-desc">Feita por devs, para devs.</div></div>
                        </div>`;
                        break;
                        
                    case 'discord':
                        outputHTML = `>> Entre na comunidade oficial no Discord para testar o compilador real: <br>
                        <a href="https://discord.gg/8HUWVdDwkc" target="_blank" class="discord-link">https://discord.gg/8HUWVdDwkc</a>`;
                        break;
                        
                    case 'clear':
                    case 'cls':
                        historyEl.innerHTML = '';
                        break;
                        
                    default:
                        outputHTML = `<span style="color: #ff5f56;">Comando "${rawInput}" não reconhecido. Digite "help" para listar os comandos válidos.</span>`;
                }

                if (outputHTML) {
                    const outputLine = document.createElement('div');
                    outputLine.className = 'line output';
                    outputLine.innerHTML = outputHTML;
                    historyEl.appendChild(outputLine);
                }

                this.value = '';
                window.scrollTo(0, document.body.scrollHeight);
            }
        });
    </script>
</body>
</html>
